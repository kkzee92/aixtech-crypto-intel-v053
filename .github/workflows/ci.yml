name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Tests
        run: PYTHONPATH=src pytest tests/ -q
      - name: Secret scan (basic)
        run: |
          if grep -rEi "(private.?key|seed|mnemonic|api.?key).{0,20}[A-Za-z0-9]{8,}" --include="*.py" --include="*.md" src docs || true; then
            echo "Potential secret pattern found (review)"
          fi
